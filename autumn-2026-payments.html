<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Файна СЕС будинок 19 (v3)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .form-container {
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s, background-color 0.3s;
        }

        input[readonly] {
            background-color: #e9ecef;
            color: #495057;
        }

        /* Стилі для поля URL, що копіюється */
        #urlInput {
            cursor: pointer;
            word-break: break-all;
            font-size: 12px;
        }

        /* Підсвічування червоним при некоректному значенні */
        input.invalid {
            border-color: #dc3545;
            background-color: #f8d7da;
        }

        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .copy-tooltip {
            color: #28a745;
            font-size: 12px;
            margin-top: 5px;
            display: none;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s, opacity 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: #0056b3;
        }

        /* Стан деактивованої кнопки */
        button:disabled {
            background-color: #6c757d;
            opacity: 0.65;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Форма оплати</h2>
    <form id="paymentForm">
        <div class="form-group">
            <label for="aptNumber">Номер квартири</label>
            <input type="number" id="aptNumber" name="aptNumber" min="1" max="162" placeholder="Введіть від 1 до 162" required>
            <div id="aptError" class="error-message">Введіть номер квартири від 1 до 162</div>
        </div>

        <div class="form-group">
            <label for="entrance">Підʼїзд</label>
            <input type="text" id="entrance" name="entrance" value="0" readonly tabindex="-1">
        </div>

        <div class="form-group">
            <label for="amount">Сума (грн)</label>
            <input type="number" id="amount" name="amount" value="4000" step="any" required>
        </div>

        <div class="form-group">
            <label for="fullName">ПІБ</label>
            <input type="text" id="fullName" name="fullName" placeholder="Прізвище, Ім'я, По батькові" required>
        </div>

        <div class="form-group">
            <label for="urlInput">URL (deeplink)</label>
            <input type="text" id="urlInput" readonly placeholder="Заповніть форму для генерації посилання">
            <div id="copyTooltip" class="copy-tooltip">Скопійовано в буфер обміну!</div>
        </div>

        <button type="submit" id="submitBtn" disabled>До оплати</button>
    </form>
</div>

<script>
    const aptInput = document.getElementById('aptNumber');
    const entranceInput = document.getElementById('entrance');
    const amountInput = document.getElementById('amount');
    const fullNameInput = document.getElementById('fullName');
    const urlInput = document.getElementById('urlInput');
    const aptError = document.getElementById('aptError');
    const submitBtn = document.getElementById('submitBtn');
    const copyTooltip = document.getElementById('copyTooltip');
    const form = document.getElementById('paymentForm');

    // UTF-8 Base64 кодування
    function utf8ToBase64(str) {
        const bytes = new TextEncoder().encode(str);
        const binString = Array.from(bytes, (byte) => String.fromCharCode(byte)).join("");
        return btoa(binString);
    }

    // Розрахунок під'їзду за номером квартири
    function calculateEntrance(val) {
        if (val >= 1 && val <= 30) return 1;
        if (val >= 31 && val <= 54) return 2;
        if (val >= 55 && val <= 80) return 3;
        if (val >= 81 && val <= 118) return 4;
        if (val >= 119 && val <= 162) return 5;
        return 0;
    }

    // Генерація deeplink
    function generateDeeplink(aptVal, entranceVal, amountVal, fullNameVal) {
        const aptFormatted = String(aptVal).padStart(3, '0');
        const purpose = `1019${aptFormatted}, ${fullNameVal.trim()}, Добровільний внесок на відновлювальні джерела енергії Сонячні панелі Будинок 19 Під’їзд ${entranceVal}`;

        const rawData = [
            "BCD",
            "002",
            "1",
            "UCT",
            "",
            'АСОЦІАЦІЯ ОСББ "ЖК ФАЙНА ТАУН"',
            "UA673226690000026000301334326",
            "UAH" + amountVal,
            "43864355",
            purpose,
            "",
            ""
        ].join("\n");

        return "https://bank.gov.ua/qr/" + utf8ToBase64(rawData);
    }

    // Перевірка стану всієї форми
    function validateForm() {
        const aptVal = parseInt(aptInput.value, 10);
        const isAptValid = !isNaN(aptVal) && aptVal >= 1 && aptVal <= 162;
        const amountVal = parseFloat(amountInput.value);
        const isAmountValid = !isNaN(amountVal) && amountVal > 0;
        const isFullNameValid = fullNameInput.value.trim().length > 0;

        // Перевірка номера квартири та вивід помилки
        if (aptInput.value !== '' && !isAptValid) {
            aptInput.classList.add('invalid');
            aptError.style.display = 'block';
            entranceInput.value = 0;
        } else {
            aptInput.classList.remove('invalid');
            aptError.style.display = 'none';
            if (isAptValid) {
                entranceInput.value = calculateEntrance(aptVal);
            } else {
                entranceInput.value = 0;
            }
        }

        // Якщо всі поля правильно заповнені
        if (isAptValid && isAmountValid && isFullNameValid) {
            submitBtn.disabled = false;
            const link = generateDeeplink(aptVal, entranceInput.value, amountInput.value, fullNameInput.value);
            urlInput.value = link;
        } else {
            submitBtn.disabled = true;
            urlInput.value = '';
        }
    }

    // Слухачі подій для валідації в реальному часі
    aptInput.addEventListener('input', validateForm);
    amountInput.addEventListener('input', validateForm);
    fullNameInput.addEventListener('input', validateForm);

    // Копіювання URL у буфер обміну при кліку
    urlInput.addEventListener('click', function() {
        if (!this.value) return;

        navigator.clipboard.writeText(this.value).then(() => {
            copyTooltip.style.display = 'block';
            setTimeout(() => {
                copyTooltip.style.display = 'none';
            }, 2500);
        }).catch(err => {
            // Резервний варіант копіювання, якщо Clipboard API заблоковано
            this.select();
            document.execCommand('copy');
            copyTooltip.style.display = 'block';
            setTimeout(() => {
                copyTooltip.style.display = 'none';
            }, 2500);
        });
    });

    // Відправка форми
    form.addEventListener('submit', function(event) {
        event.preventDefault();
        if (urlInput.value) {
            window.location.href = urlInput.value;
        }
    });

    // Первинна перевірка при завантаженні
    validateForm();
</script>

</body>
</html>
